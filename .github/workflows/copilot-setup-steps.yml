name: Copilot Setup Steps
on:
  workflow_dispatch: null
  push:
    paths:
    - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
    - .github/workflows/copilot-setup-steps.yml
jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout microsoft/vscode
      uses: actions/checkout@v6
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version-file: .nvmrc
    - name: Setup system services
      run: "set -e\n# Start X server\n./build/azure-pipelines/linux/apt-retry.sh sudo\
        \ apt-get update\n./build/azure-pipelines/linux/apt-retry.sh sudo apt-get\
        \ install -y pkg-config \\\n  xvfb \\\n  libgtk-3-0 \\\n  libxkbfile-dev \\\
        \n  libkrb5-dev \\\n  libgbm1 \\\n  rpm\nsudo cp build/azure-pipelines/linux/xvfb.init\
        \ /etc/init.d/xvfb\nsudo chmod +x /etc/init.d/xvfb\nsudo update-rc.d xvfb\
        \ defaults\nsudo service xvfb start\n"
    - name: Prepare node_modules cache key
      run: mkdir -p .build && node build/azure-pipelines/common/computeNodeModulesCacheKey.ts
        linux x64 $(node -p process.arch) > .build/packagelockhash
    - name: Restore node_modules cache
      id: cache-node-modules
      uses: actions/cache/restore@v5
      with:
        path: .build/node_modules_cache
        key: node_modules-linux-${{ hashFiles('.build/packagelockhash') }}
    - name: Extract node_modules cache
      if: steps.cache-node-modules.outputs.cache-hit == 'true'
      run: tar -xzf .build/node_modules_cache/cache.tgz
    - name: Install build dependencies
      if: steps.cache-node-modules.outputs.cache-hit != 'true'
      working-directory: build
      run: "set -e\n\nfor i in {1..5}; do # try 5 times\n  npm ci && break\n  if [\
        \ $i -eq 5 ]; then\n    echo \"Npm install failed too many times\" >&2\n \
        \   exit 1\n  fi\n  echo \"Npm install failed $i, trying again...\"\ndone\n"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Install dependencies
      if: steps.cache-node-modules.outputs.cache-hit != 'true'
      run: "set -e\n\nsource ./build/azure-pipelines/linux/setup-env.sh\n\nfor i in\
        \ {1..5}; do # try 5 times\n  npm ci && break\n  if [ $i -eq 5 ]; then\n \
        \   echo \"Npm install failed too many times\" >&2\n    exit 1\n  fi\n  echo\
        \ \"Npm install failed $i, trying again...\"\ndone\n"
      env:
        npm_config_arch: x64
        VSCODE_ARCH: x64
        ELECTRON_SKIP_BINARY_DOWNLOAD: 1
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Create node_modules archive
      if: steps.cache-node-modules.outputs.cache-hit != 'true'
      run: 'set -e

        node build/azure-pipelines/common/listNodeModules.ts .build/node_modules_list.txt

        mkdir -p .build/node_modules_cache

        tar -czf .build/node_modules_cache/cache.tgz --files-from .build/node_modules_list.txt

        '
    - name: Create .build folder
      run: mkdir -p .build
    - name: Prepare built-in extensions cache key
      run: node build/azure-pipelines/common/computeBuiltInDepsCacheKey.ts > .build/builtindepshash
    - name: Restore built-in extensions cache
      id: cache-builtin-extensions
      uses: actions/cache/restore@v5
      with:
        enableCrossOsArchive: true
        path: .build/builtInExtensions
        key: builtin-extensions-${{ hashFiles('.build/builtindepshash') }}
    - name: Download built-in extensions
      if: steps.cache-builtin-extensions.outputs.cache-hit != 'true'
      run: node build/lib/builtInExtensions.ts
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Download Electron and Playwright
      run: "set -e\n\nfor i in {1..3}; do # try 3 times (matching retryCountOnTaskFailure:\
        \ 3)\n  if npm exec -- npm-run-all2 -lp \"electron x64\" \"playwright-install\"\
        ; then\n    echo \"Download successful on attempt $i\"\n    break\n  fi\n\n\
        \  if [ $i -eq 3 ]; then\n    echo \"Download failed after 3 attempts\" >&2\n\
        \    exit 1\n  fi\n\n  echo \"Download failed on attempt $i, retrying...\"\
        \n  sleep 5 # optional: add a small delay between retries\ndone\n"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
